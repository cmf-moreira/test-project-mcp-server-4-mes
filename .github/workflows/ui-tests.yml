name: MES UI Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      MES_BASE_URL: ${{ vars.MES_BASE_URL || 'https://example.com' }}
      MES_USERNAME: ${{ secrets.MES_USERNAME }}
      MES_PASSWORD: ${{ secrets.MES_PASSWORD }}
      HEADLESS: true
      PW_VIDEO: on
      PW_TRACE: retain-on-failure
      PW_SCREENSHOT: only-on-failure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npm test

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mes-ui-artifacts
          path: |
            artifacts/
            playwright-report/
          retention-days: 14
